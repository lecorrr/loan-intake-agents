[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-intake-agents"
version = "0.3.0"
description = "A LangGraph agent team that takes car-secured loan applications from Telegram to the CRM, with a manager approving every decision."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "langchain>=1.4,<2",
    "langchain-ollama>=1.1,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi>=0.160,<1",
    "uvicorn>=0.40",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
    "aiogram>=3.31,<4",
    "aiohttp>=3.11,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6",
    "jinja2>=3.1",
    "pillow>=12",
    # v5 needs a self-hosted Langfuse 4.59 or newer (or Langfuse Cloud).
    "langfuse>=5.2,<6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff>=0.17"]

[project.scripts]
loan-agents = "loan_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
